name: Add network location fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-network-location.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply network location patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Commit location fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js index.html
          git commit -m "Add Cloudflare network location fallback"
          git push
