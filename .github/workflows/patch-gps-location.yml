name: Patch GPS location reliability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-gps-location.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch GPS logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = '/* ================== GPS GEOLOCATION ================== */'
          end_marker = '/* ================== WEATHER API ================== */'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block_b64 = ''
          new_block = base64.b64decode(block_b64).decode('utf-8')
          patched = text[:start] + new_block + text[end:]
          if patched == text:
              raise SystemExit('No change produced')
          path.write_text(patched, encoding='utf-8')
          PY

      - name: Commit patched dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve GPS location fallback and cache"
          git push
