name: Patch GPS location reliability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-gps-location.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch GPS logic
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = '/* ================== GPS GEOLOCATION ================== */'
          end_marker = '/* ================== WEATHER API ================== */'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          new_block = r'''/* ================== GPS GEOLOCATION ================== */
        let gpsRequestSeq = 0;
        const GPS_CACHE_KEY = 'dashboardGpsLastPosition';

        function findNearestWeatherStation(lat, lng) {
            let nearest = weatherStations[0];
            let minDist = Infinity;
            weatherStations.forEach(st => {
                const d = Math.hypot(st.lat - lat, st.lng - lng);
                if (d < minDist) {
                    minDist = d;
                    nearest = st;
                }
            });
            return nearest;
        }

        function setWeatherLocationLabel(name, note = '', spinning = false) {
            const locLabel = document.getElementById('weather-location');
            if (!locLabel) return;
            const icon = spinning
                ? '<i class="fa-solid fa-spinner fa-spin"></i>'
                : '<i class="fa-solid fa-location-dot"></i>';
            locLabel.innerHTML = `${icon} ${name}${note ? ` ${note}` : ''}`;
        }

        function loadCachedGPSLocation() {
            try {
                const cached = JSON.parse(localStorage.getItem(GPS_CACHE_KEY) || 'null');
                if (!cached || !Number.isFinite(cached.lat) || !Number.isFinite(cached.lng) || !cached.name) return null;
                return cached;
            } catch (e) {
                return null;
            }
        }

        function saveCachedGPSLocation(location) {
            try {
                localStorage.setItem(GPS_CACHE_KEY, JSON.stringify({ ...location, savedAt: Date.now() }));
            } catch (e) {
                // localStorage unavailable: GPS still works normally.
            }
        }

        function applyGPSPosition(pos, requestSeq) {
            if (requestSeq !== gpsRequestSeq) return;
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const nearest = findNearestWeatherStation(lat, lng);
            gpsLocation = { lat, lng, name: nearest.name };
            saveCachedGPSLocation(gpsLocation);
            setWeatherLocationLabel(nearest.name);
            fetchHKOWeather();
        }

        function requestGPSLocation() {
            const requestSeq = ++gpsRequestSeq;
            const cached = loadCachedGPSLocation();

            // 不再一開始清空為「定位中」：先顯示最後成功位置／目前預設站，GPS 在背景更新。
            if (cached) {
                gpsLocation = { lat: cached.lat, lng: cached.lng, name: cached.name };
                setWeatherLocationLabel(cached.name, '(上次位置)', true);
            } else {
                setWeatherLocationLabel(gpsLocation.name || '京士柏', '(更新定位中)', true);
            }

            if (!navigator.geolocation) {
                setWeatherLocationLabel(gpsLocation.name || '京士柏', '(GPS不支援)');
                fetchHKOWeather();
                return;
            }

            const finalFallback = (err) => {
                if (requestSeq !== gpsRequestSeq) return;
                console.warn('GPS Location unavailable:', err);
                const last = loadCachedGPSLocation();
                if (last) {
                    gpsLocation = { lat: last.lat, lng: last.lng, name: last.name };
                    setWeatherLocationLabel(last.name, '(上次位置)');
                } else {
                    gpsLocation = { lat: 22.3119, lng: 114.1728, name: '京士柏' };
                    const note = err && err.code === 1 ? '(GPS未授權)' : '(預設)';
                    setWeatherLocationLabel('京士柏', note);
                }
                fetchHKOWeather();
            };

            // 第一次先取瀏覽器／系統可用的近期位置：通常桌面與室內環境會快很多。
            navigator.geolocation.getCurrentPosition(
                (pos) => applyGPSPosition(pos, requestSeq),
                (fastErr) => {
                    if (requestSeq !== gpsRequestSeq) return;
                    if (fastErr && fastErr.code === 1) {
                        finalFallback(fastErr);
                        return;
                    }

                    // 快速定位失敗才嘗試高精度；期間仍顯示舊位置，不會只剩「定位中」。
                    const currentName = gpsLocation.name || '京士柏';
                    setWeatherLocationLabel(currentName, '(正更新GPS)', true);
                    navigator.geolocation.getCurrentPosition(
                        (pos) => applyGPSPosition(pos, requestSeq),
                        finalFallback,
                        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
                    );
                },
                { enableHighAccuracy: false, timeout: 4500, maximumAge: 600000 }
            );
        }

        '''

          patched = text[:start] + new_block + text[end:]
          if patched == text:
              raise SystemExit('No change produced')
          path.write_text(patched, encoding='utf-8')

      - name: Commit patched dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve GPS location fallback and cache"
          git push
